name: Daily Brief

on:
  schedule:
    # 每天北京时间 07:00（UTC 23:00）；GitHub 定时任务可能延迟几分钟到半小时
    - cron: "0 23 * * *"
  workflow_dispatch: {}       # 手机/网页上点一下就能手动更新

permissions:
  contents: write             # 回写生成的新闻与音频
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

env:
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
  LLM_MODEL: ${{ vars.LLM_MODEL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 缓存 Kokoro 语音模型（约 315MB，首次下载后复用）
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-models-v1

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 准备语音模型
        run: python scripts/fetch_models.py

      - name: 抓取新闻 + 机翻
        run: python scripts/fetch_news.py --limit 18 --keep-days 7

      - name: 英文精修（配了 LLM_API_KEY 才跑）
        if: env.LLM_API_KEY != ''
        run: python scripts/polish.py

      - name: 生成页面数据
        run: python scripts/build_data.py

      - name: 生成广播音频（Kokoro 神经语音，约 8-15 分钟）
        run: python scripts/gen_audio.py

      - name: 回写数据到仓库
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: daily brief $(date -u +%F)"
            git push
          fi

      - name: 打包静态站点
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          cp -r data _site/data
          rm -f _site/data/.mt_cache.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
